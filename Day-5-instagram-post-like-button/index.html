<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <main>
        <div class="card">
            <div class="top">
                <div class="user">
                    <div class="userImg"></div>
                    <h2>Alexa & Liza</h2>
                </div>
                <i class="ri-more-2-fill"></i>
            </div>
            <div class="post">
                <i id="love" class="ri-heart-3-fill"></i>
            </div>
            <div class="icons">
                <div class="left">
                    <i id="like" class="ri-heart-line"></i>
                    <i class="ri-chat-3-line"></i>
                    <i class="ri-send-plane-fill"></i>
                </div>
                <div class="right">
                    <i class="ri-bookmark-line"></i>
                </div>
            </div>
            <div class="about">
                <h3>68 likes</h3>
                <p><span>Alexa & Liza</span> Lorem ipsum dolor sit amet <span style="color: blue;">#template</span></p>
                <p>View all 696 comments</p>
                <p id="d">5 DAYS AGO</p>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
